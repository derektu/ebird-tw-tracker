name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Build ad-hoc signed DMGs
        run: npm run electron:build:mac:all
      - name: Upload macOS installers
        uses: actions/upload-artifact@v7
        with:
          name: ebird-taiwan-tracker-macos
          path: |
            release/*.dmg
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Build unsigned installer
        run: npm run electron:build:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ebird-taiwan-tracker-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
